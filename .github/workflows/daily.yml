name: daily-tracker
on:
  schedule:
    - cron: "17 3 * * *"      # once a day, 03:17 UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency: daily-tracker
jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Measure the last 24 hours, append a tracker row, rebuild the dashboard and run the tests
        env:
          FASTNEAR_API_KEY: ${{ secrets.FASTNEAR_API_KEY }}   # optional; the keyless endpoint works, just slower
        run: python3 rebuild.py --track
      - name: Publish the new row and the rebuilt dashboard (the 30-day snapshot is not touched)
        run: |
          git config user.name "xray-tracker"
          git config user.email "actions@users.noreply.github.com"
          git add data/history docs README.md THESIS.md
          git diff --cached --quiet || git commit -m "Daily tracker $(date -u +%F)"
          git push
